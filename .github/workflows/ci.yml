name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    name: ${{ matrix.name }}
    strategy:
      matrix:
        include:
          - os: macos-14
            name: macOS (Node 24)
          - os: windows-2022
            name: Windows (Node 24)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: npm run release:check
      - run: npm ci
      - name: Prepare pinned development CLI
        if: >-
          (github.event_name == 'pull_request' && github.base_ref != 'main') ||
          (github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name != 'main')
        run: npm run cli:development
      - run: node --test scripts/prepare-development-cli.test.mjs
        if: runner.os == 'Windows'
      - run: npm run check
        if: runner.os == 'macOS'
      - run: npm run build -- --test
        if: runner.os == 'Windows'
      - run: node --test dist/runtime/test/continuation-excerpt.test.mjs dist/runtime/test/notifications.test.mjs
        if: runner.os == 'Windows'
